<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncSpace Base | MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100">
  <div id="root" class="min-h-full flex flex-col"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currentView, setCurrentView] = useState("board");
      const [tasks, setTasks] = useState([]);
      const [newTaskTitle, setNewTaskTitle] = useState("");

      useEffect(() => {
        lucide.createIcons();
        fetchTasks();
      }, [currentView]);

      const fetchTasks = async () => {
        try {
          const res = await fetch('http://localhost:8000/api/v1/tasks');
          if (res.ok) setTasks(await res.json());
        } catch (err) {
          console.error("Ensure backend is running on port 8000");
        }
      };

      const handleCreateTask = async (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) return;
        
        const newTask = {
          title: newTaskTitle,
          assignee: "Unassigned",
          status: "Backlog",
          priority: "Medium",
          project: "Website redesign"
        };

        const res = await fetch('http://localhost:8000/api/v1/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newTask)
        });

        if (res.ok) {
          setNewTaskTitle("");
          fetchTasks();
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-slate-900 border-b border-slate-800 h-16 flex items-center px-6">
            <h1 className="text-xl font-bold text-blue-500 flex items-center gap-2">
              <i data-lucide="layers"></i> SyncSpace MVP
            </h1>
          </header>
          
          <main className="flex-1 p-6 max-w-6xl mx-auto w-full space-y-6">
            <form onSubmit={handleCreateTask} className="flex gap-4">
              <input 
                type="text" 
                value={newTaskTitle} 
                onChange={e => setNewTaskTitle(e.target.value)} 
                placeholder="New task title..." 
                className="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500"
              />
              <button type="submit" className="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-medium transition-colors">Add Task</button>
            </form>

            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
              {["Backlog", "In Progress", "In Review", "Done"].map(status => (
                <div key={status} className="bg-slate-900 rounded-xl p-4 min-h-[300px] border border-slate-800">
                  <h3 className="text-xs font-bold uppercase text-slate-400 mb-4">{status}</h3>
                  <div className="space-y-3">
                    {tasks.filter(t => t.status === status).map(task => (
                      <div key={task.id} className="bg-slate-800 p-3 rounded-lg border border-slate-700 hover:border-slate-600 transition-colors">
                        <p className="text-sm font-medium">{task.title}</p>
                        <p className="text-xs text-slate-500 mt-2">{task.project} • {task.priority}</p>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
