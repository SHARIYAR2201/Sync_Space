<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncSpace | Full-Stack Team Collaboration Platform</title>
  <meta name="description" content="SyncSpace combines project management, real-time messaging, productivity analytics, and AI assistance in one unified workspace." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2L2 7l10 5 10-5-10-5z'/><path d='M2 17l10 5 10-5'/><path d='M2 12l10 5 10-5'/></svg>" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@0.468.0"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    img, svg, video { max-width: 100%; }
    input, select, button, textarea { max-width: 100%; }
    body { overflow-wrap: anywhere; }
    /* Global anti-overflow & smooth scrolling */
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    /* Custom Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">

  <noscript><p style="padding:2rem">SyncSpace needs JavaScript enabled.</p></noscript>
  <div id="root" class="min-h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;


    const API = "/api/v1";
    let session = null;
    try { session = JSON.parse(localStorage.getItem("ss_session") || "null"); } catch (e) { session = null; }
    function saveSession(s) { session = s; try { s ? localStorage.setItem("ss_session", JSON.stringify(s)) : localStorage.removeItem("ss_session"); } catch (e) {} }
    let refreshing = null;
    async function doRefresh() {
      if (!session) return false;
      refreshing = refreshing || fetch(API + "/auth/refresh", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: session.refresh_token }) })
        .then(async r => { if (!r.ok) { saveSession(null); return false; } saveSession(await r.json()); return true; })
        .catch(() => false).finally(() => { refreshing = null; });
      return refreshing;
    }
    function errText(d, status) {
      if (typeof d?.detail === "string") return d.detail;
      if (Array.isArray(d?.detail)) return "Please check the highlighted fields: " + d.detail.map(x => (x.loc || []).slice(-1)[0]).filter(Boolean).join(", ") + ".";
      return status >= 500 ? "Something went wrong on our side. Please try again." : "Request failed.";
    }
    async function api(path, { method = "GET", body } = {}, retried = false) {
      let r;
      try {
        r = await fetch(API + path, { method, headers: { "Content-Type": "application/json", ...(session ? { Authorization: "Bearer " + session.access_token } : {}) }, body: body ? JSON.stringify(body) : undefined });
      } catch (e) { throw new Error("Cannot reach the server. Check your connection and try again."); }
      if (r.status === 401 && session && !retried && !path.startsWith("/auth/")) {
        if (await doRefresh()) return api(path, { method, body }, true);
        window.dispatchEvent(new Event("ss-signout"));
      }
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(errText(d, r.status));
      return d;
    }

    const ICONS = lucide.icons;
    function Icon({ name, className = "" }) {
      const pascal = String(name).split("-").map(w => w[0].toUpperCase() + w.slice(1)).join("");
      const node = ICONS[pascal];
      const inner = node ? node[2].map(([tag, a]) => `<${tag} ${Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(" ")}/>`).join("") : "";
      return <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true" dangerouslySetInnerHTML={{ __html: inner }} />;
    }

    const VIEWS = ["overview", "board", "tasks", "messages", "analytics", "ai", "settings"];
    const COLORS = ["bg-blue-600", "bg-emerald-600", "bg-purple-600", "bg-amber-600"];
    const initials = (n) => (n || "?").split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
    const decorate = (m) => ({ ...m, color: COLORS[(m.sender || "").length % 4] });
    const parseHash = () => { const h = location.hash.replace(/^#\/?/, "") || "overview"; return VIEWS.includes(h) ? h : "404"; };
    const STATUSES = ["Backlog", "Todo", "In Progress", "In Review", "Done", "Cancelled"];
    const BOARD_COLS = ["Backlog", "Todo", "In Progress", "In Review", "Done"];
    const PRIORITY_CLASS = (p) => (p === "High" || p === "Urgent") ? "bg-rose-500/20 text-rose-300" : p === "Medium" ? "bg-amber-500/20 text-amber-300" : "bg-emerald-500/20 text-emerald-300";

    // --- AUTH SCREEN (sign in / sign up / forgot / reset) ---
    function AuthScreen({ onAuthed }) {
      const [mode, setMode] = useState("login");
      const [f, setF] = useState({ name: "", email: "", password: "", token: "" });
      const [msg, setMsg] = useState(null);
      const [busy, setBusy] = useState(false);
      const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
      useEffect(() => { document.title = "SyncSpace | " + ({ login: "Sign in", register: "Create account", forgot: "Reset password", reset: "Choose new password" })[mode]; }, [mode]);
      const submit = async (e) => {
        e.preventDefault(); setMsg(null);
        if (!f.email.includes("@")) return setMsg({ t: "error", m: "Please enter a valid email address." });
        if (mode !== "forgot" && f.password.length < 8 && mode !== "login") return setMsg({ t: "error", m: "Password must be at least 8 characters." });
        setBusy(true);
        try {
          if (mode === "login" || mode === "register") {
            const d = await api("/auth/" + mode, { method: "POST", body: mode === "login" ? { email: f.email, password: f.password } : { name: f.name, email: f.email, password: f.password } });
            saveSession(d); onAuthed(d.user, mode === "register" ? "Account created. Welcome to SyncSpace!" : "Signed in successfully.");
          } else if (mode === "forgot") {
            const d = await api("/auth/forgot", { method: "POST", body: { email: f.email } }); setMsg({ t: "success", m: d.message }); setMode("reset");
          } else {
            const d = await api("/auth/reset", { method: "POST", body: { token: f.token, password: f.password } }); setMsg({ t: "success", m: d.message }); setMode("login");
          }
        } catch (err) { setMsg({ t: "error", m: err.message }); }
        setBusy(false);
      };
      const field = "w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500";
      const title = { login: "Sign in to SyncSpace", register: "Create your account", forgot: "Reset your password", reset: "Choose a new password" }[mode];
      return (
        <div className="min-h-screen flex items-center justify-center px-4 py-10 bg-slate-950">
          <div className="w-full max-w-md space-y-6">
            <a href="/" className="flex items-center justify-center gap-3" aria-label="SyncSpace home">
              <div className="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white"><Icon name="layers" className="w-5 h-5" /></div>
              <span className="font-bold text-2xl text-white">SyncSpace</span>
            </a>
            <form onSubmit={submit} className="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4" noValidate>
              <h1 className="text-xl font-bold text-white">{title}</h1>
              {msg && <div role="alert" className={`text-sm rounded-lg border p-3 ${msg.t === "error" ? "border-rose-500/50 text-rose-300 bg-rose-500/10" : "border-emerald-500/50 text-emerald-300 bg-emerald-500/10"}`}>{msg.m}</div>}
              {mode === "register" && <div><label htmlFor="n" className="block text-xs font-semibold text-slate-400 uppercase mb-1">Full name</label><input id="n" className={field} value={f.name} onChange={set("name")} autoComplete="name" required /></div>}
              {mode !== "reset" && <div><label htmlFor="e" className="block text-xs font-semibold text-slate-400 uppercase mb-1">Email</label><input id="e" type="email" className={field} value={f.email} onChange={set("email")} autoComplete="email" required /></div>}
              {mode === "reset" && <div><label htmlFor="t" className="block text-xs font-semibold text-slate-400 uppercase mb-1">Reset token</label><input id="t" className={field} value={f.token} onChange={set("token")} required /><p className="text-xs text-slate-500 mt-1">Until an email provider is configured, the token is printed in the server log.</p></div>}
              {mode !== "forgot" && <div><label htmlFor="p" className="block text-xs font-semibold text-slate-400 uppercase mb-1">{mode === "reset" ? "New password" : "Password"}</label><input id="p" type="password" className={field} value={f.password} onChange={set("password")} autoComplete={mode === "login" ? "current-password" : "new-password"} required /></div>}
              <button disabled={busy} className="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-60 text-white py-2.5 rounded-lg text-sm font-medium transition">{busy ? "Please wait…" : { login: "Sign in", register: "Create account", forgot: "Send reset instructions", reset: "Update password" }[mode]}</button>
              <div className="flex flex-wrap justify-between gap-2 text-xs text-slate-400">
                {mode === "login" ? <><button type="button" className="hover:text-white" onClick={() => { setMsg(null); setMode("register"); }}>Create an account</button><button type="button" className="hover:text-white" onClick={() => { setMsg(null); setMode("forgot"); }}>Forgot password?</button></>
                  : <button type="button" className="hover:text-white" onClick={() => { setMsg(null); setMode("login"); }}>Back to sign in</button>}
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentView, setCurrentView] = useState(parseHash());
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [user, setUser] = useState(null);
      const [booting, setBooting] = useState(!!session);
      const [tasks, setTasks] = useState([]);
      const [projects, setProjects] = useState([]);
      const [members, setMembers] = useState([]);
      const [channelList, setChannelList] = useState([]);
      const [channels, setChannels] = useState({});
      const [activeChannel, setActiveChannel] = useState("");
      const [newMessage, setNewMessage] = useState("");
      const [stats, setStats] = useState(null);
      const [notifs, setNotifs] = useState({ unread: 0, items: [] });
      const [notifOpen, setNotifOpen] = useState(false);
      const [toasts, setToasts] = useState([]);
      const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
      const [isInviteModalOpen, setIsInviteModalOpen] = useState(false);
      const [isProjectModalOpen, setIsProjectModalOpen] = useState(false);
      const [newTaskTitle, setNewTaskTitle] = useState("");
      const [newTaskAssignee, setNewTaskAssignee] = useState("");
      const [newTaskPriority, setNewTaskPriority] = useState("Medium");
      const [newTaskProject, setNewTaskProject] = useState("");
      const [newTaskDueDate, setNewTaskDueDate] = useState("");
      const [newProjectName, setNewProjectName] = useState("");
      const [inviteEmail, setInviteEmail] = useState("");
      const [inviteRole, setInviteRole] = useState("Member");
      const [profileName, setProfileName] = useState("");
      const [aiQuery, setAiQuery] = useState("");
      const [aiLogs, setAiLogs] = useState([{ sender: "AI Assistant", text: "Hi! Ask me for a workspace summary, overdue tasks, or what to prioritise. Answers come from your real task data and are suggestions only." }]);
      const [isAiLoading, setIsAiLoading] = useState(false);

      const canManage = user && ["Owner", "Admin"].includes(user.role);
      const canCreateProject = user && ["Owner", "Admin", "Manager"].includes(user.role);
      const activeMembers = members.filter(m => m.status === "Active");
      const myTasks = tasks.filter(t => user && t.assignee_id === user.id);

      const addToast = (message, type = "success") => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      };
      const fail = (e) => addToast(e.message || "Something went wrong.", "error");

      const loadAll = async () => {
        try {
          const [p, t, m, c, d, n] = await Promise.all([api("/projects"), api("/tasks"), api("/members"), api("/channels"), api("/dashboard"), api("/notifications")]);
          setProjects(p); setTasks(t); setMembers(m); setChannelList(c); setStats(d); setNotifs(n);
          setActiveChannel(prev => prev || (c[0] ? c[0].name : ""));
          if (p[0]) setNewTaskProject(prev => prev || String(p[0].id));
        } catch (e) { fail(e); }
      };
      const refreshStats = () => Promise.all([api("/dashboard"), api("/projects"), api("/notifications")]).then(([d, p, n]) => { setStats(d); setProjects(p); setNotifs(n); }).catch(() => {});

      const signOut = async (silent) => {
        const rt = session && session.refresh_token;
        saveSession(null); setUser(null); setTasks([]); setProjects([]); setMembers([]); setChannels({}); setChannelList([]); setActiveChannel(""); setStats(null);
        if (rt) fetch(API + "/auth/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: rt }) }).catch(() => {});
        if (silent !== true) addToast("You have been signed out.");
      };

      const onAuthed = (u, message) => { api("/auth/me").then(me => { setUser(me); setProfileName(me.name); addToast(message); }).catch(fail); };

      useEffect(() => {  // restore session on page load
        if (!session) return;
        api("/auth/me").then(me => { setUser(me); setProfileName(me.name); }).catch(() => saveSession(null)).finally(() => setBooting(false));
        const out = () => signOut(true); window.addEventListener("ss-signout", out); return () => window.removeEventListener("ss-signout", out);
      }, []);
      useEffect(() => { if (user) loadAll(); }, [user && user.id]);
      useEffect(() => { const h = () => setCurrentView(parseHash()); window.addEventListener("hashchange", h); return () => window.removeEventListener("hashchange", h); }, []);

      useEffect(() => {
        const titles = { overview: "Workspace Overview", board: "Kanban Board", tasks: "My Tasks", messages: "Team Messages", analytics: "Team Analytics", ai: "AI Assistant", settings: "Workspace Settings", 404: "Page Not Found" };
        if (user) document.title = "SyncSpace | " + titles[currentView];
        if (user && currentView === "overview") refreshStats();
      }, [currentView, user && user.id]);

      // Channel history + live WebSocket updates (messages are persisted by the API before broadcast)
      const channelId = (channelList.find(c => c.name === activeChannel) || {}).id;
      useEffect(() => {
        if (!user || !channelId) return;
        let ws, closed = false, timer;
        api(`/channels/${channelId}/messages`).then(rows => setChannels(prev => ({ ...prev, [activeChannel]: rows.map(decorate) }))).catch(fail);
        const connect = () => {
          ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/v1/ws?token=${session.access_token}&channel_id=${channelId}`);
          ws.onmessage = (ev) => { const m = JSON.parse(ev.data); if (m.type === "message.created") appendMessage(activeChannel, m.data); };
          ws.onclose = () => { if (!closed) timer = setTimeout(async () => { await api("/auth/me").catch(() => {}); if (session) connect(); }, 3000); };
        };
        connect();
        return () => { closed = true; clearTimeout(timer); ws && ws.close(); };
      }, [channelId, user && user.id]);
      const appendMessage = (ch, m) => setChannels(prev => { const cur = prev[ch] || []; return cur.some(x => x.id === m.id) ? prev : { ...prev, [ch]: [...cur, decorate(m)] }; });

      const handleCreateTask = async (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) return addToast("Please provide a valid task title.", "error");
        if (!newTaskProject) return addToast("Create a project first, then add tasks to it.", "error");
        try {
          const t = await api("/tasks", { method: "POST", body: { title: newTaskTitle.trim(), project_id: Number(newTaskProject), assignee_id: newTaskAssignee ? Number(newTaskAssignee) : null, priority: newTaskPriority, due_date: newTaskDueDate || null } });
          setTasks([t, ...tasks]); setNewTaskTitle(""); setNewTaskDueDate(""); setIsTaskModalOpen(false);
          addToast(`Task "${t.title}" created successfully.`); refreshStats();
        } catch (err) { fail(err); }
      };
      const moveTask = async (task, status) => {
        const before = tasks; setTasks(tasks.map(t => t.id === task.id ? { ...t, status } : t));
        try { await api(`/tasks/${task.id}`, { method: "PATCH", body: { status } }); addToast(`Moved "${task.title}" to ${status}.`); refreshStats(); }
        catch (err) { setTasks(before); fail(err); }
      };
      const handleCreateProject = async (e) => {
        e.preventDefault();
        if (!newProjectName.trim()) return addToast("Please enter a project name.", "error");
        try {
          const p = await api("/projects", { method: "POST", body: { name: newProjectName.trim() } });
          setProjects([...projects, p]); setNewTaskProject(prev => prev || String(p.id)); setNewProjectName(""); setIsProjectModalOpen(false); addToast(`Project "${p.name}" created.`); refreshStats();
        } catch (err) { fail(err); }
      };
      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!newMessage.trim()) return addToast("Cannot send an empty message.", "error");
        if (!channelId) return addToast("No channel selected.", "error");
        try { const m = await api(`/channels/${channelId}/messages`, { method: "POST", body: { body: newMessage.trim() } }); appendMessage(activeChannel, m); setNewMessage(""); }
        catch (err) { fail(err); }
      };
      const handleInviteMember = async (e) => {
        e.preventDefault();
        if (!inviteEmail.trim() || !inviteEmail.includes("@")) return addToast("Please enter a valid email address.", "error");
        try {
          const d = await api("/invitations", { method: "POST", body: { email: inviteEmail.trim(), role: inviteRole } });
          setMembers(await api("/members")); setInviteEmail(""); setIsInviteModalOpen(false);
          addToast(d.message + " (Email delivery needs a provider; the token is in the server log.)");
        } catch (err) { fail(err); }
      };
      const removeMember = async (m) => {
        if (!window.confirm(`Remove ${m.name} from this workspace?`)) return;
        try { await api(`/members/${m.id}`, { method: "DELETE" }); setMembers(members.filter(x => x.id !== m.id)); addToast(`${m.name} was removed.`); } catch (err) { fail(err); }
      };
      const saveProfile = async (e) => {
        e.preventDefault();
        if (!profileName.trim()) return addToast("Name cannot be empty.", "error");
        try { await api("/auth/me", { method: "PATCH", body: { name: profileName.trim() } }); setUser({ ...user, name: profileName.trim() }); addToast("Profile updated."); } catch (err) { fail(err); }
      };
      const markAllRead = async () => { try { await api("/notifications/read-all", { method: "POST" }); setNotifs({ ...notifs, unread: 0, items: notifs.items.map(i => ({ ...i, read: true })) }); } catch (err) { fail(err); } };
      const handleAiSubmit = async (e) => {
        e.preventDefault();
        if (!aiQuery.trim()) return addToast("Please type a question for the assistant.", "error");
        const q = aiQuery.trim(); setAiLogs(prev => [...prev, { sender: "You", text: q }]); setAiQuery(""); setIsAiLoading(true);
        try { const d = await api("/ai/ask", { method: "POST", body: { question: q } }); setAiLogs(prev => [...prev, { sender: "AI Assistant", text: `${d.answer}\n\n${d.note}` }]); }
        catch (err) { fail(err); }
        setIsAiLoading(false);
      };

      const navigateTo = (view) => {
        setMobileMenuOpen(false);
        if (view === "logout") return signOut();
        if (parseHash() === view) setCurrentView(view); else location.hash = "/" + view;
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const bell = (
        <div className="relative">
          <button onClick={() => setNotifOpen(!notifOpen)} className="relative p-2 text-slate-300 hover:text-white rounded-md hover:bg-slate-800 transition" aria-label={`Notifications, ${notifs.unread} unread`}>
            <Icon name="bell" className="w-5 h-5" />
            {notifs.unread > 0 && <span className="absolute -top-0.5 -right-0.5 bg-rose-500 text-white text-[10px] font-bold rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center">{notifs.unread}</span>}
          </button>
          {notifOpen && (
            <div className="absolute right-0 mt-2 w-72 max-w-[85vw] bg-slate-900 border border-slate-800 rounded-xl shadow-2xl z-50 p-3 space-y-2">
              <div className="flex justify-between items-center"><span className="text-sm font-bold text-white">Notifications</span><button onClick={markAllRead} className="text-xs text-blue-400 hover:text-blue-300">Mark all read</button></div>
              {notifs.items.length === 0 ? <p className="text-xs text-slate-500 py-4 text-center">You're all caught up.</p> :
                <ul className="max-h-64 overflow-y-auto space-y-1">{notifs.items.map(n => <li key={n.id} className={`text-xs p-2 rounded ${n.read ? "text-slate-400" : "text-slate-100 bg-slate-800"}`}>{n.text}</li>)}</ul>}
            </div>
          )}
        </div>
      );

      if (booting) return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">Loading your workspace…</div>;
      if (!user) return <AuthScreen onAuthed={onAuthed} />;

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          {/* TOP TOAST MESSAGES */}
          <div className="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full px-4 pointer-events-none">
            {toasts.map(toast => (
              <div 
                key={toast.id}
                className={`pointer-events-auto flex items-center justify-between p-4 rounded-lg shadow-xl border text-sm font-medium transition-all duration-300 transform translate-y-0 ${
                  toast.type === "success" 
                    ? "bg-slate-900 border-emerald-500/50 text-emerald-300" 
                    : "bg-slate-900 border-rose-500/50 text-rose-300"
                }`}
              >
                <div className="flex items-center gap-2">
                  <Icon name={toast.type === "success" ? "check-circle" : "alert-circle"} className="w-5 h-5 shrink-0" />
                  <span>{toast.message}</span>
                </div>
                <button 
                  onClick={() => setToasts(prev => prev.filter(t => t.id !== toast.id))}
                  className="text-slate-400 hover:text-white ml-3"
                >
                  <Icon name="x" className="w-4 h-4" />
                </button>
              </div>
            ))}
          </div>

          {/* MAIN HEADER / NAV BAR */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* CLICKABLE LOGO */}
              <button 
                onClick={() => navigateTo("overview")}
                className="flex items-center gap-3 group text-left focus:outline-none" aria-label="SyncSpace home"
              >

                        <div className={`max-w-xl rounded-xl p-4 text-sm ${
                          log.sender === "You" 
                            ? "bg-blue-600 text-white rounded-br-none" 
                            : "bg-slate-800 border border-slate-700 text-slate-200 rounded-bl-none"
                        }`}>
                          <span className="block text-[10px] font-mono text-slate-400 mb-1">{log.sender}</span>
                          <span className="whitespace-pre-wrap">{log.text}</span>
                        </div>
                      </div>
                    ))}
                    {isAiLoading && (
                      <div className="text-xs text-purple-400 animate-pulse flex items-center gap-2">
                        <Icon name="loader" className="w-4 h-4 animate-spin" /> Working on it…
                      </div>
                    )}
                  </div>

                  <form onSubmit={handleAiSubmit} className="pt-4 border-t border-slate-800 flex gap-2">
                    <input 
                      type="text" 
                      value={aiQuery} 
                      onChange={(e) => setAiQuery(e.target.value)}
                      placeholder="Try: summary, overdue tasks, what to prioritise" maxLength={500} aria-label="Ask the assistant"
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500"
                    />
                    <button type="submit" className="bg-purple-600 hover:bg-purple-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
                      Ask AI
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* 7. SETTINGS & MEMBERS VIEW */}
            {currentView === "settings" && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div>
                  <h1 className="text-2xl font-bold text-white">Workspace Settings</h1>
                  <p className="text-slate-400 text-sm">Manage team access roles, permissions, and profiles</p>
                </div>

                <form onSubmit={saveProfile} className="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col sm:flex-row sm:items-end gap-3">
                  <div className="flex-1"><label htmlFor="pn" className="block text-xs font-semibold text-slate-400 uppercase mb-1">Your name</label>
                    <input id="pn" value={profileName} onChange={(e) => setProfileName(e.target.value)} maxLength={120} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-blue-500" /></div>
                  <button className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm">Save profile</button>
                </form>
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-6">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                    <div>
                      <h2 className="text-lg font-bold text-white">Team Members ({members.length})</h2>
                      <p className="text-xs text-slate-400">Manage permissions and invitation status</p>
                    </div>
                    {canManage && <button onClick={() => setIsInviteModalOpen(true)} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                      Invite Member
                    </button>}
                  </div>

                  <div className="space-y-3">
                    {members.map(m => (
                      <div key={m.id} className="flex flex-wrap gap-3 items-center justify-between p-3.5 bg-slate-950 rounded-lg border border-slate-800">
                        <div className="flex items-center gap-3">
                          <div className="w-9 h-9 rounded-full bg-slate-800 text-blue-400 font-bold flex items-center justify-center text-xs">
                            {initials(m.name)}
                          </div>
                          <div>
                            <div className="text-sm font-bold text-white">{m.name}</div>
                            <div className="text-xs text-slate-400">{m.email}</div>
                          </div>
                        </div>

                        <div className="flex items-center gap-4">
                          <span className="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded border border-slate-700">
                            {m.role}
                          </span>
                          <span className={`text-xs ${m.status === "Active" ? "text-emerald-400" : "text-amber-400"}`}>
                            {m.status}
                          </span>
                          {canManage && m.id > 0 && m.role !== "Owner" && m.id !== user.id && <button onClick={() => removeMember(m)} className="text-xs text-rose-400 hover:text-rose-300" aria-label={`Remove ${m.name}`}>Remove</button>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* 8. CUSTOM 404 PAGE VIEW */}
            {currentView === "404" && (
              <div className="py-16 text-center space-y-4 max-w-md mx-auto">
                <div className="w-20 h-20 mx-auto bg-rose-500/10 border border-rose-500/30 rounded-2xl flex items-center justify-center text-rose-400">
                  <Icon name="alert-triangle" className="w-10 h-10" />
                </div>
                <h1 className="text-4xl font-extrabold text-white">404 - Page Not Found</h1>
                <p className="text-slate-400 text-sm">
                  We couldn't find that page. It may have moved or never existed.
                </p>
                <div className="pt-4">
                  <button onClick={() => navigateTo("overview")} className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition shadow-lg shadow-blue-600/20">
                    Return to Workspace Overview
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* CREATE TASK MODAL */}
          {isTaskModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full max-h-[90dvh] overflow-y-auto p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-bold text-white">Create New Task</h3>
                  <button onClick={() => setIsTaskModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleCreateTask} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Task Title</label>
                    <input 
                      type="text"
                      value={newTaskTitle}
                      onChange={(e) => setNewTaskTitle(e.target.value)}
                      placeholder="What needs to be done?" maxLength={200}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Assignee</label>
                      <select 
                        value={newTaskAssignee} 
                        onChange={(e) => setNewTaskAssignee(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200"
                      >
                        <option value="">Unassigned</option>
                        {activeMembers.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Priority</label>
                      <select 
                        value={newTaskPriority} 
                        onChange={(e) => setNewTaskPriority(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200"
                      >
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Project</label>
                    <select 
                      value={newTaskProject} 
                      onChange={(e) => setNewTaskProject(e.target.value)} aria-label="Project"
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200"
                    >
                      {projects.map(p => (
                        <option key={p.id} value={p.id}>{p.name}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Due date (optional)</label>
                    <input type="date" value={newTaskDueDate} onChange={(e) => setNewTaskDueDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-blue-500" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsTaskModalOpen(false)} className="px-4 py-2 text-sm text-slate-400 hover:text-white">
                      Cancel
                    </button>
                    <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                      Create Task
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isProjectModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleCreateProject} className="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full max-h-[90dvh] overflow-y-auto p-6 shadow-2xl space-y-4">
                <h3 className="text-lg font-bold text-white">New project</h3>
                <input value={newProjectName} onChange={(e) => setNewProjectName(e.target.value)} maxLength={120} aria-label="Project name" placeholder="Project name" className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-blue-500" />
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setIsProjectModalOpen(false)} className="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancel</button>
                  <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Create project</button>
                </div>
              </form>
            </div>
          )}
          {/* INVITE MEMBER MODAL */}
          {isInviteModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full max-h-[90dvh] overflow-y-auto p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-bold text-white">Invite Workspace Member</h3>
                  <button onClick={() => setIsInviteModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleInviteMember} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Email Address</label>
                    <input 
                      type="email"
                      value={inviteEmail}
                      onChange={(e) => setInviteEmail(e.target.value)}
                      placeholder="name@example.com"
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Role</label>
                    <select 
                      value={inviteRole} 
                      onChange={(e) => setInviteRole(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200"
                    >
                      <option value="Admin">Admin</option>
                      <option value="Manager">Manager</option>
                      <option value="Member">Member</option>
                    </select>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsInviteModalOpen(false)} className="px-4 py-2 text-sm text-slate-400 hover:text-white">
                      Cancel
                    </button>
                    <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                      Send Invitation
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 border-t border-slate-800 py-8 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4">
              
              <div className="flex items-center gap-3">
                <button onClick={() => navigateTo("overview")} className="font-bold text-white flex items-center gap-2">
                  <div className="w-6 h-6 rounded bg-blue-600 flex items-center justify-center text-xs">
                    <Icon name="layers" className="w-3.5 h-3.5" />
                  </div>
                  <span>SyncSpace</span>
                </button>
                <span className="text-slate-500 text-sm">|</span>
                <span className="text-xs text-slate-400">© {new Date().getFullYear()} SyncSpace Inc. All rights reserved.</span>
              </div>

              {/* FOOTER LINKS */}
              <div className="flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-xs text-slate-400">
                <button onClick={() => navigateTo("overview")} className="hover:text-white transition">Overview</button>
                <button onClick={() => navigateTo("analytics")} className="hover:text-white transition">Analytics</button>
                <button onClick={() => navigateTo("ai")} className="hover:text-white transition">AI Copilot</button>
                <button onClick={() => navigateTo("settings")} className="hover:text-white transition">Settings</button>
                <a href="tel:+18005550199" className="hover:text-blue-400 transition font-mono">+1 (800) 555-0199</a>
                <a href="mailto:support@syncspace.io" className="hover:text-blue-400 transition font-mono">support@syncspace.io</a>
              </div>

            </div>
          </footer>

        </div>
      );
    }

    // Render App into DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
