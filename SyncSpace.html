<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncSpace | Full-Stack Team Collaboration Platform</title>
  <meta name="description" content="SyncSpace combines project management, real-time messaging, productivity analytics, and AI assistance in one unified workspace." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2L2 7l10 5 10-5-10-5z'/><path d='M2 17l10 5 10-5'/><path d='M2 12l10 5 10-5'/></svg>" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Global anti-overflow & smooth scrolling */
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    /* Custom Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">

  <div id="root" class="min-h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- INITIAL MOCK DATA (PDF Aligned) ---
    const initialProjects = [
      { id: 1, name: "Website redesign", progress: 78, color: "bg-blue-500", status: "Active" },
      { id: 2, name: "Mobile app", progress: 54, color: "bg-emerald-500", status: "Active" },
      { id: 3, name: "API migration", progress: 32, color: "bg-purple-500", status: "Active" },
      { id: 4, name: "Marketing site", progress: 91, color: "bg-amber-500", status: "Active" }
    ];

    const initialTasks = [
      { id: "T1", title: "Review existing pages", assignee: "Mina", status: "Backlog", priority: "Medium", project: "Website redesign", dueDate: "2026-10-25" },
      { id: "T2", title: "Audit accessibility", assignee: "Alex", status: "Backlog", priority: "Low", project: "Website redesign", dueDate: "2026-10-28" },
      { id: "T3", title: "Build navigation", assignee: "You", status: "In Progress", priority: "High", project: "Website redesign", dueDate: "2026-10-21" },
      { id: "T4", title: "Mobile layout", assignee: "Sam", status: "In Progress", priority: "Medium", project: "Mobile app", dueDate: "2026-10-22" },
      { id: "T5", title: "Update design tokens", assignee: "Mina", status: "In Review", priority: "Low", project: "Website redesign", dueDate: "2026-10-20" },
      { id: "T6", title: "Set up project", assignee: "Alex", status: "Done", priority: "High", project: "API migration", dueDate: "2026-10-15" },
      { id: "T7", title: "Create wireframes", assignee: "Sam", status: "Done", priority: "Medium", project: "Marketing site", dueDate: "2026-10-18" }
    ];

    const initialMessages = {
      "#engineering": [
        { id: 1, sender: "Mina Chen", time: "10:14 AM", text: "The API contract is ready for review.", avatar: "MC", color: "bg-emerald-600" },
        { id: 2, sender: "Alex Morgan", time: "10:16 AM", text: "I'll add integration tests this afternoon.", avatar: "AM", color: "bg-purple-600" },
        { id: 3, sender: "You", time: "10:20 AM", text: "Great! I'll connect the task board to the endpoints.", avatar: "YOU", color: "bg-blue-600" },
        { id: 4, sender: "Sam Patel", time: "10:25 AM", text: "I have uploaded the updated wireframes.", avatar: "SP", color: "bg-amber-600" }
      ],
      "#general": [
        { id: 5, sender: "Mina Chen", time: "09:00 AM", text: "Good morning team! Welcome to Sprint 04.", avatar: "MC", color: "bg-emerald-600" }
      ],
      "#design": [
        { id: 6, sender: "Sam Patel", time: "Yesterday", text: "New Figma tokens pushed for dark theme.", avatar: "SP", color: "bg-amber-600" }
      ],
      "#project-alpha": [
        { id: 7, sender: "Alex Morgan", time: "2 days ago", text: "Database migration script verified.", avatar: "AM", color: "bg-purple-600" }
      ]
    };

    const initialMembers = [
      { id: 1, name: "Mina Chen", role: "Owner", email: "mina@syncspace.io", avatar: "MC", status: "Online" },
      { id: 2, name: "Alex Morgan", role: "Admin", email: "alex@syncspace.io", avatar: "AM", status: "Online" },
      { id: 3, name: "Sam Patel", role: "Manager", email: "sam@syncspace.io", avatar: "SP", status: "Away" },
      { id: 4, name: "You (Developer)", role: "Admin", email: "you@syncspace.io", avatar: "YOU", status: "Online" }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentView, setCurrentView] = useState("landing");
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [tasks, setTasks] = useState(initialTasks);
      const [projects, setProjects] = useState(initialProjects);
      const [channels, setChannels] = useState(initialMessages);
      const [activeChannel, setActiveChannel] = useState("#engineering");
      const [newMessage, setNewMessage] = useState("");
      const [members, setMembers] = useState(initialMembers);
      
      // Toast System State
      const [toasts, setToasts] = useState([]);

      // Modal States
      const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
      const [isInviteModalOpen, setIsInviteModalOpen] = useState(false);
      const [isContactModalOpen, setIsContactModalOpen] = useState(false);

      // Task Form State
      const [newTaskTitle, setNewTaskTitle] = useState("");
      const [newTaskAssignee, setNewTaskAssignee] = useState("Mina");
      const [newTaskPriority, setNewTaskPriority] = useState("Medium");
      const [newTaskProject, setNewTaskProject] = useState("Website redesign");
      const [newTaskDueDate, setNewTaskDueDate] = useState("2026-10-30");

      // Invite Form State
      const [inviteEmail, setInviteEmail] = useState("");
      const [inviteRole, setInviteRole] = useState("Member");

      // AI Chat State
      const [aiQuery, setAiQuery] = useState("");
      const [aiLogs, setAiLogs] = useState([
        { sender: "AI Assistant", text: "Hello! I am your SyncSpace AI workspace copilot. How can I assist with your sprint analysis or task breakdowns today?" }
      ]);
      const [isAiLoading, setIsAiLoading] = useState(false);

      // Dynamic Title & Icon Syncing
      useEffect(() => {
        const titleMap = {
          landing: "SyncSpace | Team Collaboration Platform",
          overview: "SyncSpace | Workspace Overview",
          board: "SyncSpace | Kanban Board",
          tasks: "SyncSpace | My Tasks",
          messages: "SyncSpace | Team Messages",
          analytics: "SyncSpace | Team Analytics",
          ai: "SyncSpace | AI Assistant",
          settings: "SyncSpace | Workspace Settings",
          404: "SyncSpace | Page Not Found"
        };
        document.title = titleMap[currentView] || "SyncSpace Platform";
        lucide.createIcons();
      }, [currentView, tasks, channels, activeChannel, toasts, aiLogs]);

      // Toast Generator helper
      const addToast = (message, type = "success") => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      // Handle Task Creation
      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) {
          addToast("Please provide a valid task title.", "error");
          return;
        }
        const newTask = {
          id: `T${tasks.length + 1}`,
          title: newTaskTitle.trim(),
          assignee: newTaskAssignee,
          status: "Backlog",
          priority: newTaskPriority,
          project: newTaskProject,
          dueDate: newTaskDueDate
        };
        setTasks([newTask, ...tasks]);
        setNewTaskTitle("");
        setIsTaskModalOpen(false);
        addToast(`Task "${newTask.title}" created successfully!`, "success");
      };

      // Handle Send Message
      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!newMessage.trim()) {
          addToast("Cannot send an empty message.", "error");
          return;
        }
        const msgObj = {
          id: Date.now(),
          sender: "You",
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          text: newMessage.trim(),
          avatar: "YOU",
          color: "bg-blue-600"
        };
        setChannels({
          ...channels,
          [activeChannel]: [...(channels[activeChannel] || []), msgObj]
        });
        setNewMessage("");
        addToast("Message posted to channel.", "success");
      };

      // Handle Invite Member
      const handleInviteMember = (e) => {
        e.preventDefault();
        if (!inviteEmail.trim() || !inviteEmail.includes("@")) {
          addToast("Please enter a valid email address.", "error");
          return;
        }
        const newM = {
          id: members.length + 1,
          name: inviteEmail.split("@")[0],
          role: inviteRole,
          email: inviteEmail.trim(),
          avatar: inviteEmail.slice(0, 2).toUpperCase(),
          status: "Pending"
        };
        setMembers([...members, newM]);
        setInviteEmail("");
        setIsInviteModalOpen(false);
        addToast(`Invitation sent to ${inviteEmail}`, "success");
      };

      // Handle AI Query
      const handleAiSubmit = (e) => {
        e.preventDefault();
        if (!aiQuery.trim()) {
          addToast("Please type a prompt for the AI assistant.", "error");
          return;
        }
        const userPrompt = aiQuery;
        setAiLogs(prev => [...prev, { sender: "You", text: userPrompt }]);
        setAiQuery("");
        setIsAiLoading(true);

        setTimeout(() => {
          let aiResponse = "I have analyzed your workspace. All 4 projects are on track with an average completion rate of 64%. You have 6 overdue tasks that require attention in the Website Redesign milestone.";
          if (userPrompt.toLowerCase().includes("summary") || userPrompt.toLowerCase().includes("sprint")) {
            aiResponse = "Sprint 04 Summary: 124 tasks completed to date. 'Website Redesign' is at 78% progress. Top contributor is Mina Chen with 14 tasks resolved this week.";
          } else if (userPrompt.toLowerCase().includes("priority") || userPrompt.toLowerCase().includes("task")) {
            aiResponse = "Suggested Priority Adjustment: Recommend elevating 'Build navigation' to Urgent due to dependent API endpoints being ready.";
          }
          setAiLogs(prev => [...prev, { sender: "AI Assistant", text: aiResponse }]);
          setIsAiLoading(false);
          addToast("AI analysis generated.", "success");
        }, 1200);
      };

      // Quick view switcher helper
      const navigateTo = (view) => {
        setCurrentView(view);
        setMobileMenuOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          {/* TOP TOAST MESSAGES */}
          <div className="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full px-4 pointer-events-none">
            {toasts.map(toast => (
              <div 
                key={toast.id}
                className={`pointer-events-auto flex items-center justify-between p-4 rounded-lg shadow-xl border text-sm font-medium transition-all duration-300 transform translate-y-0 ${
                  toast.type === "success" 
                    ? "bg-slate-900 border-emerald-500/50 text-emerald-300" 
                    : "bg-slate-900 border-rose-500/50 text-rose-300"
                }`}
              >
                <div className="flex items-center gap-2">
                  <i data-lucide={toast.type === "success" ? "check-circle" : "alert-circle"} className="w-5 h-5 shrink-0"></i>
                  <span>{toast.message}</span>
                </div>
                <button 
                  onClick={() => setToasts(prev => prev.filter(t => t.id !== toast.id))}
                  className="text-slate-400 hover:text-white ml-3"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>
              </div>
            ))}
          </div>

          {/* MAIN HEADER / NAV BAR */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* CLICKABLE LOGO */}
              <button 
                onClick={() => navigateTo("overview")}
                className="flex items-center gap-3 group text-left focus:outline-none"
              >
                <div className="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20 group-hover:bg-blue-500 transition">
                  <i data-lucide="layers" className="w-5 h-5"></i>
                </div>
                <div>
                  <span className="font-bold text-lg text-white tracking-tight group-hover:text-blue-400 transition">SyncSpace</span>
                  <span className="block text-[10px] text-slate-400 font-mono tracking-wider uppercase -mt-1">WORKSPACE v2.4</span>
                </div>
              </button>

              {/* DESKTOP MAIN NAVIGATION */}
              <nav className="hidden md:flex items-center gap-1">
                {[
                  { id: "overview", label: "Overview", icon: "layout-dashboard" },
                  { id: "board", label: "Kanban Board", icon: "kanban" },
                  { id: "tasks", label: "My Tasks", icon: "check-square" },
                  { id: "messages", label: "Messages", icon: "message-square" },
                  { id: "analytics", label: "Analytics", icon: "bar-chart-2" },
                  { id: "ai", label: "AI Copilot", icon: "sparkles" }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => navigateTo(item.id)}
                    className={`flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition ${
                      currentView === item.id 
                        ? "bg-slate-800 text-blue-400 border border-slate-700" 
                        : "text-slate-300 hover:text-white hover:bg-slate-800/50"
                    }`}
                  >
                    <i data-lucide={item.icon} className="w-4 h-4"></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>

              {/* DESKTOP HEADER ACTIONS */}
              <div className="hidden md:flex items-center gap-3">
                <button 
                  onClick={() => setIsTaskModalOpen(true)}
                  className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2 rounded-md text-sm font-medium transition shadow-lg shadow-blue-600/20"
                >
                  <i data-lucide="plus" className="w-4 h-4"></i>
                  <span>New Task</span>
                </button>
                
                <button 
                  onClick={() => navigateTo("settings")}
                  className="p-2 text-slate-400 hover:text-white rounded-md hover:bg-slate-800 transition"
                  title="Workspace Settings"
                >
                  <i data-lucide="settings" className="w-5 h-5"></i>
                </button>

                <button 
                  onClick={() => navigateTo("404")}
                  className="p-2 text-slate-400 hover:text-white rounded-md hover:bg-slate-800 transition"
                  title="Test 404 Page"
                >
                  <i data-lucide="alert-triangle" className="w-5 h-5"></i>
                </button>
              </div>

              {/* MOBILE HAMBURGER BUTTON */}
              <div className="flex md:hidden items-center gap-2">
                <button 
                  onClick={() => setIsTaskModalOpen(true)}
                  className="bg-blue-600 text-white p-2 rounded-md"
                >
                  <i data-lucide="plus" className="w-5 h-5"></i>
                </button>
                <button 
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="p-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-md focus:outline-none"
                  aria-label="Toggle Mobile Menu"
                >
                  <i data-lucide={mobileMenuOpen ? "x" : "menu"} className="w-6 h-6"></i>
                </button>
              </div>

            </div>

            {/* MOBILE NAVIGATION DRAWER */}
            {mobileMenuOpen && (
              <div className="md:hidden bg-slate-900 border-b border-slate-800 px-4 pt-2 pb-4 space-y-1">
                {[
                  { id: "overview", label: "Overview", icon: "layout-dashboard" },
                  { id: "board", label: "Kanban Board", icon: "kanban" },
                  { id: "tasks", label: "My Tasks", icon: "check-square" },
                  { id: "messages", label: "Messages", icon: "message-square" },
                  { id: "analytics", label: "Analytics", icon: "bar-chart-2" },
                  { id: "ai", label: "AI Copilot", icon: "sparkles" },
                  { id: "settings", label: "Settings", icon: "settings" },
                  { id: "404", label: "404 Preview", icon: "alert-triangle" }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => navigateTo(item.id)}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-base font-medium transition ${
                      currentView === item.id 
                        ? "bg-blue-600/20 text-blue-400 border border-blue-500/30" 
                        : "text-slate-300 hover:bg-slate-800"
                    }`}
                  >
                    <i data-lucide={item.icon} className="w-5 h-5"></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </div>
            )}
          </header>

          {/* MAIN CONTENT AREA BASED ON VIEW */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            
            {/* 1. WORKSPACE OVERVIEW VIEW */}
            {currentView === "overview" && (
              <div className="space-y-6">
                
                {/* Header Welcome Banner */}
                <div className="bg-gradient-to-r from-blue-900/40 via-slate-900 to-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                  <div>
                    <h1 className="text-2xl sm:text-3xl font-bold text-white tracking-tight">Good morning, team 👋</h1>
                    <p className="text-slate-400 text-sm mt-1">Here's your workspace performance and active sprint health at a glance.</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => navigateTo("board")} className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition">
                      View Board
                    </button>
                    <button onClick={() => setIsInviteModalOpen(true)} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                      Invite Member
                    </button>
                  </div>
                </div>

                {/* Metric Summary Cards */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active projects</span>
                    <div className="text-3xl font-extrabold text-blue-400 mt-2">08</div>
                    <div className="text-xs text-slate-500 mt-1">Across 3 departments</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Tasks completed</span>
                    <div className="text-3xl font-extrabold text-emerald-400 mt-2">124</div>
                    <div className="text-xs text-emerald-500 mt-1">↑ +14% this week</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Overdue tasks</span>
                    <div className="text-3xl font-extrabold text-rose-400 mt-2">06</div>
                    <div className="text-xs text-rose-500 mt-1">Requires attention</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Team members</span>
                    <div className="text-3xl font-extrabold text-purple-400 mt-2">18</div>
                    <div className="text-xs text-slate-500 mt-1">4 active now</div>
                  </div>
                </div>

                {/* Main Progress & Activity Grid */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  
                  {/* Project Progress Section */}
                  <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <div className="flex items-center justify-between mb-4">
                      <h2 className="text-lg font-bold text-white">Project progress</h2>
                      <span className="text-xs text-slate-400">Calculated from backend task data</span>
                    </div>
                    <div className="space-y-5">
                      {projects.map(proj => (
                        <div key={proj.id} className="space-y-1.5">
                          <div className="flex justify-between text-sm font-medium">
                            <span className="text-slate-200">{proj.name}</span>
                            <span className="text-slate-400">{proj.progress}%</span>
                          </div>
                          <div className="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
                            <div className={`h-full ${proj.color} transition-all duration-500`} style={{ width: `${proj.progress}%` }}></div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Recent Activity Section */}
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <h2 className="text-lg font-bold text-white mb-4">Recent activity</h2>
                    <ul className="space-y-4">
                      {[
                        { text: "Mina completed task 'Design tokens'", color: "bg-emerald-500", time: "10 mins ago" },
                        { text: "New comment on Sprint 04", color: "bg-blue-500", time: "25 mins ago" },
                        { text: "Alex joined API migration project", color: "bg-purple-500", time: "1 hour ago" },
                        { text: "Deadline updated for Mobile App", color: "bg-amber-500", time: "3 hours ago" },
                        { text: "Task assigned to you: Build nav", color: "bg-emerald-500", time: "5 hours ago" }
                      ].map((act, idx) => (
                        <li key={idx} className="flex items-start gap-3">
                          <span className={`w-2 h-2 rounded-full ${act.color} mt-2 shrink-0`}></span>
                          <div>
                            <p className="text-sm text-slate-300">{act.text}</p>
                            <span className="text-xs text-slate-500">{act.time}</span>
                          </div>
                        </li>
                      ))}
                    </ul>
                  </div>

                </div>

              </div>
            )}

            {/* 2. KANBAN BOARD VIEW */}
            {currentView === "board" && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h1 className="text-2xl font-bold text-white">Project Board</h1>
                    <p className="text-slate-400 text-sm">Website redesign / Sprint 04</p>
                  </div>
                  <button onClick={() => setIsTaskModalOpen(true)} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 self-start sm:self-auto">
                    <i data-lucide="plus" className="w-4 h-4"></i> Add Task
                  </button>
                </div>

                {/* Kanban Columns (Overflow Wrapper for Mobile) */}
                <div className="overflow-x-auto pb-4">
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4 min-w-[800px]">
                    {["Backlog", "In Progress", "In Review", "Done"].map(status => {
                      const colTasks = tasks.filter(t => t.status === status);
                      return (
                        <div key={status} className="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex flex-col">
                          <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                            <span className="text-xs font-bold uppercase tracking-wider text-slate-400">{status}</span>
